<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardd</title>
    <link rel="stylesheet" href="stylec.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.2.0/css/all.min.css">
    <script src="scriptc.js" defer></script>
</head>
<body>

<div class="bdy">
<!--isme me saar samaan daaluga-->
    <div class="card">
        <div class="head">
            <p>PROFILE CARD</p>
        </div>
        <!--isme JS se photo daaluga-->
        <div class="avatar" id="profilePhoto"></div>
        <div class="in">

            <div class="identity">
                <h2>Sarvagya Khandelwal</h2>    
            </div>

            <div class="stats">

                <div class="stat-box">
                    <h3>Problems Solved</h3>
                    <p>300+</p>
                </div>

                <div class="stat-box">
                    <h3>Projects Built</h3>
                    <p>3</p>
                </div>

            </div>

            <div class="social-box">
                <h3>You can find me on ...</h3>

                <div class="social-links">
                    <button class="wtf" id="gh"><i class="fa-brands fa-github" style="color: rgb(0, 0, 0);"></i></button>
                    <button class="wtf" id="ln"><i class="fa-brands fa-linkedin" style="color: rgb(4, 135, 238);"></i></button>
                    <button class="wtf" id="lc  "><i class="fa-brands fa-leetcode" style="color: rgb(0, 0, 0);"></i></button>
                </div>
            </div>
            <div class="skills">
                <span>#SQL</span>
                <span>#C++</span>
                <span>#REACT</span>
                <span>#HTML</span>
                <span>#CSS</span>
                <span>#JAVASCRIPT</span>
            </div>
        </div>
    </div>
</div>

</body>
</html>
